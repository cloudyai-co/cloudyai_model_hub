<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudyAI Model Hub</title>
    <meta
      name="description"
      content="Generate CycloneDX 1.6 AI Bills of Materials (AIBOMs) and printable PDF reports for Hugging Face models, and estimate what a model needs to run."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Icon sprite. Each symbol is drawn from the same 24 x 24 grid and is referenced by id from an SVG use element. -->
    <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" /><path d="M5.5 15.5v-11h10" /></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M13.5 4.5h6v6M19.5 4.5l-9 9M17.5 14v5.5h-13v-13h5.5" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5l4.5 4.5" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" /></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z" /><path d="M12 10v4.5M12 17.5v.5" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4.5 4.5v12.5H6z" /><path d="M14 3.5V8h4.5" /></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3.5h8l4.5 4.5v12.5H6z" /><path d="M9 14.5h6M9 17.5h4M9 11.5h2" /></symbol>
      <symbol id="i-hash" viewBox="0 0 24 24"><path d="M9.5 4l-2 16M16.5 4l-2 16M4.5 9h16M3.5 15h16" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5v4h-4" /></symbol>
    </svg>

    <header class="masthead">
      <div class="wrap masthead-inner">
        <a class="brand" href="#/" aria-label="CloudyAI Model Hub: overview">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect x="2" y="2" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M2 10h7M2 16h12M2 22h7" fill="none" stroke="currentColor" stroke-width="2" />
            <rect class="brand-accent" x="21" y="13" width="9" height="6" />
          </svg>
          <span class="brand-name">CloudyAI <span>Model Hub</span></span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="#/" data-route="overview">Overview</a>
          <a href="#/aibom" data-route="aibom">AIBOM</a>
          <a href="#/selection" data-route="selection">Model selection</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" data-mode="light">
          <svg class="icon icon-moon" aria-hidden="true" focusable="false"><use href="#i-moon" /></svg>
          <svg class="icon icon-sun" aria-hidden="true" focusable="false"><use href="#i-sun" /></svg>
          <span class="label">Dark</span>
        </button>
      </div>
    </header>

    <main id="main" class="wrap view" tabindex="-1">
      <p class="status" role="status">Loading</p>
    </main>

    <svg class="tickrule" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="ticks" width="10" height="14" patternUnits="userSpaceOnUse">
          <path d="M0.5 0v14" stroke="currentColor" stroke-width="1" fill="none" />
        </pattern>
      </defs>
      <rect width="100%" height="10" fill="url(#ticks)" />
      <line x1="0" x2="100%" y1="0.5" y2="0.5" stroke="currentColor" stroke-width="1" />
    </svg>

    <footer class="colophon">
      <div class="wrap colophon-hand">
        <p class="hand">Set in IBM Plex on paper-coloured pixels. Prints nicely on A4 — try it.</p>
      </div>
      <div class="wrap colophon-inner">
        <p>
          CloudyAI Model Hub <span class="mono" id="app-version"></span> · Apache-2.0 · Built with love by
          KhanKindle.
        </p>
        <p>
          <a href="https://github.com/cloudyai-co/cloudyai_model_hub">Source</a> ·
          <a href="api/docs">API reference</a> ·
          <a href="https://github.com/cloudyai-co/cloudyai_model_hub/blob/main/docs/aibom-mapping.md"
            >Field mapping</a
          >
          · Verify before compliance use.
        </p>
      </div>
    </footer>
  </body>
</html>
